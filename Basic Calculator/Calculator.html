<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="images/developer.png" />
    <link rel="stylesheet" type="text/css" href="style/design.css">
    <title>Basic Calculator</title>                
</head>
<body class="home-background">
    <div class="navbar">
        <div>Calculator Program in JavaScript</div>
    </div> 
    
    <div class="calculator"> 
        <h4 id="company">CASIO</h4>
        <h6 id="edition">3rd edition</h6>
        <input class= "textview" id="result" placeholder="0">
        <table>   
            <tr>
                <td><input class = "btn" type = "button" value = "AC" id= "operator" onclick="ac()"></td>
                <td><input class = "btn" type = "button" value = "%" id="operator" onclick="insert('%')"> </td>
                <td><input class = "btn" type = "button" value = "/" id="operator" onclick="insert('/')"> </td>
                <td><input class = "btn" type = "button" value = "⌫" id ="operator" onclick="del()">
            </tr>

            <tr>
                <td><input class = "btn" type = "button" value = "7" onclick="insert(7)"> </td>
                <td><input class = "btn" type = "button" value = "8" onclick="insert(8)"> </td>
                <td><input class = "btn" type = "button" value = "9" onclick="insert(9)"> </td>           
                <td><input class = "btn" type = "button" value = "*" id = "operator" onclick="insert('*')"></td>
            </tr>

            <tr>
                <td><input class = "btn" type = "button" value = "4" onclick="insert(4)"> </td>
                <td><input class = "btn" type = "button" value = "5" onclick="insert(5)"> </td>
                <td><input class = "btn" type = "button" value = "6" onclick="insert(6)"> </td>           
                <td><input class = "btn" type = "button" value = "-" id = "operator" onclick="insert('-')"></td>
            </tr>

            <tr>
                <td><input class = "btn" type = "button" value = "1" onclick="insert(1)"> </td>
                <td><input class = "btn" type = "button" value = "2" onclick="insert(2)"> </td>
                <td><input class = "btn" type = "button" value = "3" onclick="insert(3)"> </td>
                <td><input class = "btn" type = "button" value = "+" id = "operator" onclick="insert('+')"></td>
            </tr>       
        
            <tr>            
                <td><input class = "btn" type = "button" value = "0" onclick="insert(0)"></td>
                <td><input class = "btn" type = "button" value = "." id= "operator" onclick="insert('.')"></td>
                <td colspan = 2><input class = "btn" style = "width: 110px" type = "button" value = "=" id="equal" onclick="equal('=')"></td>
            </tr>
        </table>
    </div>
    
    <script src="js/function.js"></script>
</body>
</html>
